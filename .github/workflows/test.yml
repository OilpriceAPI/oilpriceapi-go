name: Test Go SDK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23", "1.24", "1.25", "1.26"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Check coverage
        if: matrix.go-version == '1.26'
        run: go tool cover -func=coverage.out

      - name: Vet
        run: go vet ./...

  clean-install:
    name: Clean consumer example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run exact documented example against fixtures
        env:
          SDK_REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./scripts/clean-install-smoke.sh

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run required keyless demo contract
        run: go test -tags live -v -count=1 -run '^TestLiveGetDemoPrices$' .

      # Run authenticated tests only when the repo secret is present. Forks
      # have no secret, so this remains a no-op there. The public demo contract
      # above is independent of that secret and can never silently skip.
      #
      # NOTE: the guard MUST live in the shell — the `secrets` context is not
      # available in step-level `if:` conditions, and referencing it there
      # makes GitHub reject this ENTIRE workflow file. That bug killed all CI
      # (unit tests included) from Jun 21 to Jul 3, 2026 — issue #12.
      - name: Run live tests against production API
        env:
          OILPRICEAPI_TEST_KEY: ${{ secrets.OILPRICEAPI_TEST_KEY }}
        run: |
          if [ -z "$OILPRICEAPI_TEST_KEY" ]; then
            echo "OILPRICEAPI_TEST_KEY not set — skipping live tests (fork or unconfigured)."
            exit 0
          fi
          go test -tags live -v -count=1 ./...
